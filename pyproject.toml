[project]
name = "ttbox-module-edition"
version = "0.1.0"
description = "TTBOX-模块版：RK3588 AI 视觉盒子基础平台（HDMI 采集 / RGA / RKNN NPU / DecodeNMS / 目标选择 / Web 控制）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "evdev>=1.7,<2.0",
    "Flask>=3.1,<4",
]

[project.optional-dependencies]
rknn = ["rknn-toolkit-lite2>=2.3.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*", "plugins*", "ttbox_platform*", "ttbox_motion*"]

[tool.pytest.ini_options]
# 三套 Python 用例都是"正常入口"的一部分：裸 `python -m pytest` 即跑全量
# （P6-2026-10-01：原先只列 2 套 ⇒ 裸入口漏跑 plugins/web/tests 的 482 条）。
testpaths = ["framework/tests", "ttbox_platform/tests", "plugins/web/tests"]
