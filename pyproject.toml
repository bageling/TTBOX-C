[project]
name = "ttbox-module-edition"
version = "0.1.0"
description = "TTBOX-模块版：RK3588 AI 视觉盒子基础平台（HDMI 采集 / RGA / RKNN NPU / DecodeNMS / 目标选择 / Web 控制）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "evdev>=1.7,<2.0",
]
# ★ V1.0.52：Flask 依赖已移除 —— Web 面板后端由 C++ ttbox_web 提供（V1.0.47 起基线），
#   本批（批次 1「去 Python」）已删除 plugins/web 下全部 .py，Flask 不再被任何代码引用。

[project.optional-dependencies]
rknn = ["rknn-toolkit-lite2>=2.3.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# ★ V1.0.52：framework* / ttbox_platform* 已随「去 Python」批次 1 删除，不再声明。
include = ["plugins*", "ttbox_motion*"]

[tool.pytest.ini_options]
# ★ V1.0.52：framework/tests 与 ttbox_platform/tests 与 plugins/web/tests 已随
#   「去 Python」批次 1 删除（第三者原来还有 482 条用例，随之移除）。
#   现只余 core/tests —— 那里放的是 **C++ 代码的结构守卫**
#   （如 test_core_app_split_layout.py 锁 Application 四 TU 的成员归属）。
testpaths = ["core/tests"]
