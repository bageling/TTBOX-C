<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.08), transparent 35%),
        #f5f7fb;
    }
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .quota-hint {
      font-size: 13px;
      color: #4b5563;
      margin: 0;
      text-align: center;
    }
    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      cursor: pointer;
    }
    .feedback-button {
      background: #16a34a;
      border-color: #15803d;
      color: #ffffff;
    }
    .primary-download {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #ffffff;
    }
    .export-select {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      width: 100%;
    }
    .tab-button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-button:hover {
      background: #f3f4f6;
    }
    .tab-button.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .canvas {
      width: min(100%, 1600px);
      min-width: 0;
      padding: 24px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
    }
    .view-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .view-button {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
    }
    .view-button[aria-pressed="true"] {
      border-color: #3b82f6;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .view-status {
      color: #6b7280;
      font-size: 12px;
    }
    .diagram-viewport {
      width: 100%;
      height: clamp(240px, 66vh, 900px);
      overflow: auto;
      overscroll-behavior: contain;
    }
    .diagram-frame {
      width: 100%;
      margin: 0 auto;
    }
    .tab-content {
      display: none;
      width: 100%;
    }
    .tab-content.active {
      display: block;
    }
    .diagram-frame > svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
    }
    .deep-edit-panel {
      display: flex;
      gap: 12px;
      width: min(96vw, 1600px);
      align-items: center;
    }
    .deep-edit-panel input {
      flex: 1;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      font-size: 14px;
      color: #111827;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    .deep-edit-panel input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .deep-edit-submit {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
      white-space: nowrap;
    }
    .deep-edit-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .deep-edit-error {
      width: min(96vw, 1600px);
      margin: 0;
      font-size: 13px;
      color: #dc2626;
      display: none;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-dialog {
      width: min(92vw, 420px);
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);
    }
    .modal-dialog h3 {
      margin: 0;
      font-size: 16px;
      color: #111827;
    }
    .modal-desc {
      margin: 0;
      font-size: 13px;
      color: #4b5563;
    }
    .modal-dialog input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-dialog input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .modal-status {
      margin: 0;
      font-size: 13px;
      min-height: 18px;
    }
    .modal-status.ok {
      color: #16a34a;
    }
    .modal-status.err {
      color: #dc2626;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .modal-actions button {
      flex: 1;
      min-height: 36px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-actions button.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .modal-link {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="actions">
    <div class="action-buttons">
      <a class="action-button feedback-button" href="https://pptx.chenxitech.site/feedback?session_id=7f1e0794-27c9-4381-9979-98d2c865c818&amp;run_id=7af0434c-f548-4fa6-867a-2525bc7caa0a" target="_blank" rel="noopener noreferrer">💡 提交反馈领免费 API Key</a>
      <button class="action-button primary-download" id="download-visio-button" type="button">下载 Visio (.vsdx)</button>
      <select class="export-select" id="ppt-format" aria-label="选择 PPT 格式或 SVG">
        <optgroup label="PPT 格式">
          <option value="pptx-native">PPT：可编辑形状</option>
          <option value="pptx-svg">PPT：嵌入 SVG</option>
          <option value="pptx">PPT：兼容格式</option>
        </optgroup>
        <optgroup label="其他格式">
          <option value="svg">SVG 原图</option>
        </optgroup>
      </select>
      <button class="action-button" id="download-other-button" type="button">下载所选格式</button>
      <button class="action-button" id="api-key-config-button" type="button">🔑 编辑额度 Key</button>
    </div>
    <p class="quota-hint">🎁 提交反馈并完成邮箱验证，可免费领取更多额度</p>
    <p class="modal-status" id="download-status" role="status" aria-live="polite"></p>
  </div>
  <div class="canvas">
    
    <div class="view-controls" role="group" aria-label="图示缩放">

      <button class="view-button" type="button" data-view="actual" aria-pressed="false">原尺寸</button>
      <span class="view-status" aria-live="polite"></span>

" dy="18.5">其余支撑域：</tspan><tspan x="656" dy="18.5">config 配置分层</tspan><tspan x="656" dy="18.5">合并 / auth 本地</tspan><tspan x="656" dy="18.5">与云端授权校验 / </tspan><tspan x="656" dy="18.5">hid USB 设备层</tspan><tspan x="656" dy="18.5">（控制器名运行时解</tspan><tspan x="656" dy="18.5">析，不写死编号）/ </tspan><tspan x="656" dy="18.5">fan 风扇 PWM </tspan><tspan x="656" dy="18.5">控制</tspan></text></g><g class="Ym9keS5sYW5lMi5yMi5zdGVwX3N0ZXBfNzk3MDU3ZjBmNDg1 action"><g class="shape" ><rect x="858" y="939" width="236" height="120" rx="5" stroke="#1F6FB4" fill="white" style="stroke-width:1;" /></g><text x="976" y="978.5" fill="#18334F" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="976" dy="0">① 采集：</tspan><tspan x="976" dy="19.25">V4L2Capture 从摄像</tspan><tspan x="976" dy="19.25">头取帧，DMA-BUF 零</tspan><tspan x="976" dy="19.25">拷贝缓冲区池</tspan></text></g><g class="Ym9keS5sYW5lMi5yMy5zdGVwX3N0ZXBfMThkM2QxMjE4ZGRl action"><g class="shape" ><rect x="858" y="1117" width="236" height="144" rx="5" stroke="#1F6FB4" fill="white" style="stroke-width:1;" /></g><text x="976" y="1159.5" fill="#18334F" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="976" dy="0">② 推理：WorkerPool </tspan><tspan x="976" dy="19">多线程跑 NPU（Rknn </tspan><tspan x="976" dy="19">引擎加载并执行模型）——</tspan><tspan x="976" dy="19"> 仅当功能门允许推理，关</tspan><tspan x="976" dy="19">掉就不起</tspan></text></g><g class="Ym9keS5sYW5lMi5yNC5zdGVwX3N0ZXBfZmNiNzJkMmZjZGEy action"><g class="shape" ><rect x="858" y="1319" width="236" height="144" rx="5" stroke="#1F6FB4" fill="white" style="stroke-width:1;" /></g><text x="976" y="1361.5" fill="#18334F" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="976" dy="0">③ 鼠标透传通道 Physic</tspan><tspan x="976" dy="19">alMouseReader 启动 </tspan><tspan x="976" dy="19">—— 红线段：与 AI 授</tspan><tspan x="976" dy="19">权无关，恒启动，失败只告</tspan><tspan x="976" dy="19">警不阻塞流水线</tspan></text></g><g class="Ym9keS5sYW5lMi5yNS5zdGVwX3N0ZXBfYTBjMjNiMWZhY2Jh action"><g class="shape" ><rect     <div class="modal-dialog">
      <h3>配置编辑额度 Key</h3>
      <p class="modal-desc">填写邮件发给您的 ContextWeave Key（含 50 次额度）。浏览器本地保存，深度编辑时由服务端核对额度。</p>

        <button id="api-key-save" class="primary" type="button">保存</button>
        <button id="api-key-close" type="button">关闭</button>
      </div>
      <a class="modal-link" href="https://pptx.chenxitech.site/feedback?session_id=7f1e0794-27c9-4381-9979-98d2c865c818&amp;run_id=7af0434c-f548-4fa6-867a-2525bc7caa0a" target="_blank" rel="noopener noreferrer">没有 Key？提交反馈领取 →</a>
    </div>

  <script>
    (function () {
      const visioButton = document.getElementById("download-visio-button");
      const otherButton = document.getElementById("download-other-button");
      const formatSelect = document.getElementById("ppt-format");
      const downloadStatus = document.getElementById("download-status");
      const exportEndpoint = "https://pptx.chenxitech.site/export-session/browser";
      const sessionID = "7f1e0794-27c9-4381-9979-98d2c865c818";
      const canvas = document.querySelector(".canvas");
      if (!visioButton || !otherButton || !canvas) {
        return;
      }
      
      const tabButtons = document.querySelectorAll(".tab-button");
      const tabContents = document.querySelectorAll(".tab-content");
      const viewport = canvas.querySelector(".diagram-viewport");
      const viewButtons = canvas.querySelectorAll(".view-button");
      const viewStatus = canvas.querySelector(".view-status");
      let viewMode = "width";

      function activeFrame() {
        const activeContent = canvas.querySelector(".tab-content.active");
        return (activeContent || viewport).querySelector(".diagram-frame");
      }

      function updateView(resetScroll) {
        const frame = activeFrame();
        const svg = frame && frame.querySelector("svg");
        if (!svg) return;
        const box = svg.viewBox && svg.viewBox.baseVal;
        const declaredWidth = Number((svg.getAttribute("width") || "").replace(/px$/, ""));
        const declaredHeight = Number((svg.getAttribute("height") || "").replace(/px$/, ""));
        const width = declaredWidth > 0 ? declaredWidth : box && box.width;
        const height = declaredHeight > 0 ? declaredHeight : box && box.height;
        if (!(width > 0 && height > 0)) return;

        // Measure the unscaled SVG text. Keep the source SVG untouched so export
        // and embedded tooltip code retain their original attributes and styles.
        let minFontSize = Infinity;
        svg.querySelectorAll("text, tspan").forEach(text => {
          const size = parseFloat(window.getComputedStyle(text).fontSize);
          if (size > 0 && text.textContent.trim()) minFontSize = Math.min(minFontSize, size);
        });
        const intrinsicScale = box && box.width > 0 && box.height > 0 ? Math.min(width / box.width, height / box.height) : 1;
        const readableScale = Number.isFinite(minFontSize) ? Math.min(1, 12 / (minFontSize * intrinsicScale)) : 0.75;
        // Reserve a scrollbar gutter so remeasuring cannot oscillate at the edge.
        const availableWidth = Math.max(1, viewport.clientWidth - 18);
        const availableHeight = Math.max(1, viewport.clientHeight - 18);
        let scale = 1;
        if (viewMode === "width") scale = Math.max(readableScale, Math.min(1, availableWidth / width));
        if (viewMode === "all") scale = Math.min(1, availableWidth / width, availableHeight / height);
        frame.style.width = (width * scale) + "px";
        frame.style.height = (height * scale) + "px";
        const scrollable = width * scale > availableWidth || height * scale > availableHeight;
        viewStatus.textContent = Math.round(scale * 100) + "%" + (scrollable ? " · 可滚动查看" : "");
        if (resetScroll) {
          viewport.scrollLeft = 0;
          viewport.scrollTop = 0;
        }
      }

      viewButtons.forEach(button => {
        button.addEventListener("click", () => {
          viewMode = button.getAttribute("data-view");
          viewButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
          updateView(true);
        });
      });
      window.addEventListener("resize", () => updateView(false));
      canvas.addEventListener("diagram-updated", () => updateView(true));
      updateView(false);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => updateView(false));
      
      tabButtons.forEach(button => {
        button.addEventListener("click", () => {
          tabButtons.forEach(btn => btn.classList.remove("active"));
          tabContents.forEach(content => content.classList.remove("active"));
          
          button.classList.add("active");
          const targetId = button.getAttribute("data-target");
          const targetContent = document.getElementById(targetId);
          if (targetContent) {
            targetContent.classList.add("active");
          }
          updateView(true);
        });
      });

      function downloadSVG() {
        let svg = null;
        if (tabContents.length > 0) {
          const activeContent = document.querySelector(".tab-content.active");
          if (activeContent) {
            svg = activeContent.querySelector("svg");
          }
        } else {
          svg = canvas.querySelector("svg");
        }
        
        if (!svg) {
          downloadStatus.textContent = "当前页面未找到可导出的 SVG";
          return;
        }
        const serializer = new XMLSerializer();
        let svgSource = serializer.serializeToString(svg);
        if (!svgSource.includes("xmlns=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if (!svgSource.includes("xmlns:xlink=")) {
          svgSource = svgSource.replace("<svg", '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }
        const blob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = blobUrl;
        
        let dlName = "diagram-7f1e0794-27c9-4381-9979-98d2c865c818.svg";
        if (tabContents.length > 0) {
          const activeBtn = document.querySelector(".tab-button.active");
          if (activeBtn) {
            dlName = dlName.replace(".svg", "-" + activeBtn.textContent.trim() + ".svg");
          }
        }
        link.download = dlName;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      }

      function downloadSessionFormat(format, button) {
        if (format === "svg") {
          downloadSVG();
          return;
        }
        if (!sessionID) {
          downloadStatus.textContent = "当前页面缺少会话信息，无法导出 Office 文件";
          return;
        }
        button.disabled = true;
        downloadStatus.textContent = "正在生成文件…";
        fetch(exportEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionID, format: format })
        }).then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok || data.status !== "ok") {
              throw new Error((data.error && data.error.message) || data.detail || "导出失败");
            }
            return data;
          });
        }).then(function (data) {
          if (!data.download_url) throw new Error("服务端未返回下载地址");
          const link = document.createElement("a");
          link.href = data.download_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          document.body.appendChild(link);
          link.click();
          link.remove();
          downloadStatus.textContent = "文件已生成，下载即将开始";
        }).catch(function (error) {
          downloadStatus.textContent = error.message || "导出失败，请稍后重试";
        }).finally(function () {
          button.disabled = false;
        });
      }

      visioButton.addEventListener("click", function () {
        downloadSessionFormat("vsdx-native", visioButton);
      });
      otherButton.addEventListener("click", function () {
        downloadSessionFormat(formatSelect.value, otherButton);
      });
    })();
  </script>
  <script>
    (function () {
      var CW_SESSION_ID = "7f1e0794-27c9-4381-9979-98d2c865c818";
      var CW_RUN_ID = "7af0434c-f548-4fa6-867a-2525bc7caa0a";
      var API_KEY_STORAGE_KEY = "cw_quota_api_key";
      var EDIT_ENDPOINT = "https://pptx.chenxitech.site/session/edit/browser";

      var modal = document.getElementById("api-key-modal");
      var openButton = document.getElementById("api-key-config-button");
      var closeButton = document.getElementById("api-key-close");
      var saveButton = document.getElementById("api-key-save");
      var keyInput = document.getElementById("api-key-input");
      var keyStatus = document.getElementById("api-key-status");
      var editInput = document.getElementById("deep-edit-input");
      var editButton = document.getElementById("deep-edit-submit");
      var editError = document.getElementById("deep-edit-error");
      if (!modal || !openButton || !editButton) {
        return;
      }

      function setKeyStatus(message, ok) {
        keyStatus.textContent = message;
        keyStatus.className = "modal-status " + (ok ? "ok" : "err");
      }

      function openModal() {
        var saved = localStorage.getItem(API_KEY_STORAGE_KEY);
        if (saved) {
          keyInput.value = saved;
          setKeyStatus("已加载本地保存的 Key", true);
        } else {
          keyInput.value = "";
          setKeyStatus("", true);
        }
        modal.style.display = "flex";
      }

      function closeModal() {
        modal.style.display = "none";
      }

      function showEditError(message) {
        editError.textContent = message;
        editError.style.display = "block";
      }

      function hideEditError() {
        editError.textContent = "";
        editError.style.display = "none";
      }

      // 页面加载时若已保存 Key，则回填（password 输入框自动掩码显示）
      var existingKey = localStorage.getItem(API_KEY_STORAGE_KEY);
      if (existingKey) {
        keyInput.value = existingKey;
      }

      openButton.addEventListener("click", openModal);
      closeButton.addEventListener("click", closeModal);
      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });

      saveButton.addEventListener("click", function () {
        var key = keyInput.value.trim();
        if (!key) {
          setKeyStatus("请输入 Key", false);
          return;
        }
        localStorage.setItem(API_KEY_STORAGE_KEY, key);
        setKeyStatus("已保存到浏览器本地", true);
      });

      editButton.addEventListener("click", function () {
        var instruction = editInput.value.trim();
        if (!instruction) {
          showEditError("请先描述你想如何修改这张图");
          return;
        }
        if (!CW_SESSION_ID) {
          showEditError("当前页面缺少 session_id，无法进行深度编辑");
          return;
        }
        var key = localStorage.getItem(API_KEY_STORAGE_KEY);
        if (!key) {
          openModal();
          setKeyStatus("请填写并保存邮件中的额度 Key", false);
          return;
        }
        hideEditError();
        editButton.disabled = true;
        editButton.textContent = "生成中…";
        fetch(EDIT_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": key
          },
          body: JSON.stringify({ session_id: CW_SESSION_ID, instruction: instruction })
        }).then(function (resp) {
          return resp.json().then(function (data) {
            if (!resp.ok) {
              if (resp.status === 401 || resp.status === 403) {
                throw new Error("额度 Key 无效，请核对邮件中的 ContextWeave Key");
              }
              if (resp.status === 402) {
                throw new Error("编辑额度已用完，请通过页面上方的反馈入口领取更多额度");
              }
              var detail = (data && data.detail) ? data.detail : ("请求失败（HTTP " + resp.status + "）");
              throw new Error(detail);
            }
            return data;
          });
        }).then(function (data) {
          if (!data || !data.svg) {
            throw new Error("响应中缺少 svg 内容");
          }
          var activeTab = document.querySelector(".tab-content.active");
          var target = (activeTab || document.querySelector(".diagram-viewport")).querySelector(".diagram-frame");
          target.innerHTML = data.svg;
          document.querySelector(".canvas").dispatchEvent(new Event("diagram-updated"));
          hideEditError();
        }).catch(function (err) {
          showEditError(err.message || "深度编辑失败，请稍后重试");
        }).finally(function () {
          editButton.disabled = false;
          editButton.textContent = "深度编辑";
        });
      });
    })();
  </script>
</body>
</html>
